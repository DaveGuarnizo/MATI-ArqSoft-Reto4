<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect x="1" y="1" width="958" height="358" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="800" fill="#0F172A">Simulación de Pérdida Total de Máquina (EXP-1b · SIGKILL sin relanzar)</text>
  <text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#475569">Comparación visual: por qué la arquitectura con réplicas pierde 0 pánicos y la línea base pierde ~61 %</text>

  <!-- PANEL IZQUIERDO: TACTICA -->
  <rect x="28" y="76" width="440" height="256" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="248" y="102" text-anchor="middle" font-size="14.5" font-weight="700" fill="#166534">CON TÁCTICA (Réplicas RF=3 + Failover)</text>

  <!-- Nodo 1 caido -->
  <rect x="52" y="122" width="130" height="58" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="117" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">Nodo 1 (CAÍDO)</text>
  <text x="117" y="165" text-anchor="middle" font-size="10.5" fill="#B91C1C">SIGKILL · Disco perdido</text>

  <!-- Nodo 2 vivo -->
  <rect x="52" y="198" width="130" height="58" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
  <text x="117" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Nodo 2 (ACTIVO)</text>
  <text x="117" y="241" text-anchor="middle" font-size="10.5" fill="#15803D">Asume tráfico en 0,37 s</text>

  <!-- BD segura -->
  <rect x="290" y="160" width="152" height="96" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="366" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#0F766E">PostgreSQL</text>
  <text x="366" y="212" text-anchor="middle" font-size="16" font-weight="800" fill="#15803D">58.000 / 58.000</text>
  <text x="366" y="234" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803D">100 % guardados (0 perd.)</text>

  <!-- Flujo animado vivo -->
  <path d="M 182 227 C 235 227, 235 208, 290 208" stroke="#16A34A" stroke-width="3" fill="none"/>
  <circle r="5" fill="#16A34A">
    <animateMotion dur="1.1s" repeatCount="indefinite" path="M 182 227 C 235 227, 235 208, 290 208"/>
  </circle>
  <circle r="5" fill="#16A34A">
    <animateMotion dur="1.1s" begin="0.55s" repeatCount="indefinite" path="M 182 227 C 235 227, 235 208, 290 208"/>
  </circle>

  <text x="248" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">✓ El acuse se envía tras replicar: el dato ya existía en otros nodos</text>

  <!-- PANEL DERECHO: LINEA BASE -->
  <rect x="492" y="76" width="440" height="256" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="712" y="102" text-anchor="middle" font-size="14.5" font-weight="700" fill="#991B1B">LÍNEA BASE (Sin réplicas · Auto-commit)</text>

  <!-- Nodo unico caido -->
  <rect x="516" y="158" width="142" height="68" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="587" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">Nodo Único (CAÍDO)</text>
  <text x="587" y="205" text-anchor="middle" font-size="10.5" fill="#B91C1C">Sin réplica · Tráfico muerto</text>

  <!-- Flujo cortado con X -->
  <path d="M 658 192 L 750 192" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <circle cx="704" cy="192" r="12" fill="#DC2626">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="704" y="197" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">✕</text>

  <!-- BD incompleta -->
  <rect x="752" y="146" width="156" height="96" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="830" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">PostgreSQL</text>
  <text x="830" y="198" text-anchor="middle" font-size="15.5" font-weight="800" fill="#DC2626">~22.300 / 58.000</text>
  <text x="830" y="220" text-anchor="middle" font-size="11.5" font-weight="700" fill="#DC2626">~35.600 perdidos (~61 %)</text>

  <text x="712" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">✕ Al caer la máquina, todo lo pendiente en ella desaparece</text>
</svg>